# DiffusionGemma 26B-A4B — Docker-managed, self-recovering inference service.
#
#   docker compose build           # build the sm_89 image from the fork source
#   docker compose up -d           # start (binds host :8084 — stop the host process first)
#   docker compose logs -f         # watch supervisor + backend
#   curl -s localhost:8084/health  # liveness (reports the backend child, not just the shell)
#
# The 26 GB GGUF is bind-mounted (not baked). The container shares the `visionflow_runtime`
# network with OpenWebUI; it ALSO publishes :8084 to the host so host-networked clients
# (OpenWebUI) and other containers (email-mcp-gateway via host.docker.internal) keep working.
services:
  diffusiongemma:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: "13.0.1"
        CUDA_ARCH: "89"
    image: diffusiongemma:cuda13
    container_name: diffusiongemma
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0          # GPU0 (the model needs ~41 GB)
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_GRAPH_OPT=1             # concurrent Q/K/V CUDA streams + buffer reuse
      - NGL=99                            # offload all layers
      - DG_PORT=8084
      - DG_MODEL=/models/diffusiongemma-26B-A4B-it-Q8_0.gguf
      - DG_ADMIN_TOKEN=${DG_ADMIN_TOKEN:-}   # set in .env to require a bearer token on /admin/*
    volumes:
      # Host GGUF -> container (read-only). Adjust the host path if the model moves.
      - ../models/diffusiongemma-26B-A4B-it/diffusiongemma-26B-A4B-it-Q8_0.gguf:/models/diffusiongemma-26B-A4B-it-Q8_0.gguf:ro
    ports:
      - "8084:8084"
    networks:
      - visionflow_runtime
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/health | grep -q '\"backend\": \"alive\"' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu, compute, utility]

networks:
  visionflow_runtime:
    external: true
