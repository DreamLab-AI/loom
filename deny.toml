# cargo-deny gate: licences + advisories. Permissive-but-real allowlist.
# Run: cargo deny check

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The workspace itself is AGPL-3.0-only; the allowlist below is the set of
# permissive licences a dependency may carry. Anything outside this list fails.
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"          # path-dep siblings legitimately float versions

[sources]
unknown-registry = "warn"
unknown-git = "allow"        # ruvector-core is an intra-monorepo path dep
