[package]
name = "loom-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Client for an Ontology Loom façade: an OpenAI-compatible chat endpoint that grounds requests in an ontology, with per-request opt-outs, a reasoning-model token floor, and truncation-aware retries."
readme = "README.md"
keywords = ["llm", "openai", "client", "ontology", "rag"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
