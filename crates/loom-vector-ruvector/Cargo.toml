[package]
name = "loom-vector-ruvector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "VectorIndex adapter: in-process ruvector-core HNSW read (hot path) + off-turn Postgres write channel (build-time only)."

[dependencies]
loom-domain = { path = "../loom-domain" }
# In-process HNSW read (hot path). Default features carry hnsw + storage.
ruvector-core = { workspace = true }
# The domain VectorIndex port is `#[async_trait]`; the read path is async.
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Off-turn / build-time write channel to ruvector-postgres ONLY — feature-gated
# so the serving binary never links Postgres on the query hot path.
tokio-postgres = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }
# The staging bin embeds through the LOCKED bge-small-en-v1.5/384 adapter.
# Optional + pg-write-gated so the serving binary never links reqwest here.
loom-embed-xinference = { path = "../loom-embed-xinference", optional = true }

[dev-dependencies]
# Recall-gate integration test embeds via Xinference over HTTP.
reqwest = { workspace = true }
# Unit tests build throwaway ruvector-core DBs in a tempdir.
tempfile = "3"

[features]
default = []
# The build/off-turn write channel to ruvector-postgres.
pg-write = ["dep:tokio-postgres", "dep:pgvector", "dep:loom-embed-xinference"]
# Master gate for the semantic fallback code path (recall-gate governed).
semantic-fallback = []

# The exporter links Postgres — only compilable under `pg-write`, so the default
# serving build (and `--no-default-features`) never pulls it in (EXP-001).
[[bin]]
name = "export_corpus"
path = "src/bin/export_corpus.rs"
required-features = ["pg-write"]

# The corpus stager: embed the concept records and emit idempotent upsert SQL.
# Build/off-turn only, so it rides the same pg-write gate.
[[bin]]
name = "stage_corpus"
path = "src/bin/stage_corpus.rs"
required-features = ["pg-write"]

[lints]
workspace = true
