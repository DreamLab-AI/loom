[package]
name = "loom-scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lexical matcher + confidence-gated injection policy (pure, LLM-free, network-free)."

[dependencies]
loom-domain = { path = "../loom-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
# Insertion-ordered maps: preserves Python dict iteration order for the
# `by_title` first-wins rule and the slug-substring scan. Local to this crate.
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tokio = { workspace = true }

[[bench]]
name = "match"
harness = false

# The CONCEPT-INDEX record builder (ADR-136 D3) — pure, deterministic, no new
# deps. Byte-parity with the retired tools/ingest/build_concept_records.py is
# pinned by tests/golden-python/golden_concept_records.jsonl.
[[bin]]
name = "build-concept-records"
path = "src/bin/build_concept_records.rs"

[lints]
workspace = true
