[package]
name = "loom-facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Ontology Loom serving node: axum/tower composition root + the two deploy profiles."

[lib]
name = "loom_facade"
path = "src/lib.rs"

[[bin]]
name = "loom-facade"
path = "src/main.rs"

# --- dream-cycle evaluators (ADR-138) ---------------------------------------
# Small stdin-driven checkers, run by dream.config.json evaluatorEntrypoints.
# They live in THIS crate so they can adopt the facade's typed `/health` structs
# as those land; they pull in no extra dependency of their own.
[[bin]]
name = "confidence-check"
path = "src/bin/confidence_check.rs"

[[bin]]
name = "graph-check"
path = "src/bin/graph_check.rs"

[[bin]]
name = "generation-check"
path = "src/bin/generation_check.rs"

[dependencies]
loom-domain = { path = "../loom-domain" }
# The adapters — the composition root binds one concrete impl per port.
loom-scaffold = { path = "../loom-scaffold" }
loom-graph-oxigraph = { path = "../loom-graph-oxigraph" }
loom-vector-ruvector = { path = "../loom-vector-ruvector" }
loom-embed-xinference = { path = "../loom-embed-xinference" }
loom-backend-openai = { path = "../loom-backend-openai" }

axum = { workspace = true }
tower = { workspace = true }
# `timeout` added on top of the workspace features so tower_http maps the
# distill timeout to a 408 response (keeps the service error Infallible for axum).
tower-http = { workspace = true, features = ["timeout"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Re-hash artifact shas in the mirror's verify_atomicity (§11.6).
sha2 = { workspace = true }

[dev-dependencies]
# In-memory oneshot router tests + a mock model backend for the chat path.
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
http-body-util = "0.1"
# `tests/contract_live.rs` probes a RUNNING facade over real HTTP (LOOM_URL);
# the oneshot router tests need no client, this one does.
reqwest = { workspace = true }

[lints]
workspace = true
