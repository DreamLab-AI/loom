# Ontology Loom — Profile A: host-colocated on HP (RUST-ARCHITECTURE §13).
# The REFERENCE serving deployment. Loom + model share one host; :8084 is DNAT'd
# to the LAN by hp-nat.service. Serves FULLY with NO docker-network access —
# lexical + in-process HNSW + in-context oxigraph are all network-free; the model
# is the only outbound, over the host loopback (ADR-137). GPU-colocated model.
#
#   docker build -f loom/deploy/Dockerfile -t loom:rust /home/devuser/workspace
#   docker compose -f loom/deploy/compose.profile-a.yml up -d
#   curl http://127.0.0.1:8084/health          # facade
#   curl http://127.0.0.1:8085/health          # loom-model (Qwen3.8-27B, separate unit)
services:
  loom:
    image: loom:rust
    container_name: loom-facade-a
    # :8084 DNAT'd to the LAN by hp-nat.service; model reached at 127.0.0.1:8085.
    network_mode: host
    environment:
      LOOM_FACADE_PORT: "8084"
      LOOM_DEPLOY_PROFILE: "a"
      # The model-swap seam: loom-model Qwen3.8-27B on the host loopback, GPU-colocated.
      DISTILL_BACKEND_URL: "http://127.0.0.1:8085/v1"
      # In-proc HNSW artifact is present but gated OFF until the recall bench clears (§8.4).
      LOOM_SEMANTIC_FALLBACK: "0"
      # Reasoning backends truncate to empty below 1536 max_tokens (§10 the 400→empty trap).
      LOOM_MIN_MAX_TOKENS: "1536"
      ONTOLOGY_BUDGET: "1500"
      # --- findings-driven serving features (paper measured on THIS node) --------
      # F1 verbatim serving: for a delivery-lookup on a HIGH-confidence scaffold,
      # serve the curated markdown directly (no 60–170s generative re-encode of a
      # scaffold the model can only restate; context-utilisation 0.90–0.955,
      # beyond-exposure recovery 3/11,360). Threshold 8.0 == an EXACT title match
      # on the LEXICAL additive scale (conservative — paraphrase-only hits still
      # delegate). Per-request opt-out: {"loom_options":{"verbatim":false}}.
      LOOM_VERBATIM_MODE: "1"
      LOOM_VERBATIM_THRESHOLD: "8.0"
      # F3 no-think: an engaged (scaffold-injected) delegation asks the backend to
      # skip thinking — matches quality for delivery-shaped tasks at ~5.5× less
      # wall-clock (smoke test), and stops think-tokens exhausting the budget on
      # long scaffolds. Only applied when the client did not set chat_template_kwargs.
      LOOM_BACKEND_NO_THINK: "1"
      # F3 think-token floor (when thinking IS active): raise a sub-floor integer
      # max_tokens so reasoning does not truncate the answer. 0 disables.
      LOOM_THINK_TOKEN_FLOOR: "1536"
      # F2 exposure telemetry is ALWAYS on when injected (the loom.exposure block);
      # LOOM_EXPOSURE_APPEND additionally appends a "Not covered above" line to the
      # answer — left off here (telemetry only, no content mutation by default).
      # LOOM_EXPOSURE_APPEND: "0"
      RUST_LOG: "info"
    # Mirrored generation incl. ontology-corpus.rvdb — READ-ONLY (the entrypoint
    # copies the rvdb to a writable /run/loom before opening it; see entrypoint.sh).
    # Path is relative to THIS compose file (loom/deploy/). Point it at the fully
    # mirrored generation dir: scaffold-index.json + prose-index.json + the TTLs +
    # ontology-corpus.rvdb(+.generation.json). `../data` is the repo's mirror dir.
    volumes:
      - ../data:/app/data:ro
    # CANONICAL artefact dir is `<repo>/data/` (this `../data`); `app/data/` is LEGACY & UNMOUNTED.
    # NB: app/mirror.sh writes to app/data/ — sync artefacts into ../data before `up`, or the log
    # says "lexical index NOT loaded ... empty floor" while /health still 200s (a path bug, not a
    # dead container). See README Deploy → "empty floor trap".
    # tmpfs for the writable rvdb copy — keeps the mutating redb off any bind mount
    # and out of the writable image layer (fast, ephemeral, right-sized).
    # uid/gid MUST match the image's non-root user (65532) or the entrypoint's
    # cp fails with EACCES (verified on the HP cutover, 2026-08-17).
    tmpfs:
      - /run/loom:mode=0750,uid=65532,gid=65532
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
