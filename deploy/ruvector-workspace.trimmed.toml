# TRIMMED ruvector workspace root — DEPLOY VENDOR ARTIFACT (owned by loom/deploy).
# The loom facade path-depends on ../ruvector/crates/ruvector-core, which inherits
# 31 fields via `workspace = true`, so cargo needs a ruvector workspace root to
# resolve inheritance. The REAL root lists ~120 members that we do not vendor, so
# the Dockerfile COPYs THIS trimmed root over /build/ruvector/Cargo.toml instead.
# [workspace.package] + [workspace.dependencies] are kept BYTE-FOR-BYTE from the
# real root so `--locked` resolution against loom/Cargo.lock is identical.
# The [patch.crates-io] hnsw_rs override is intentionally dropped: loom is the root
# workspace being built, only its patches apply, and loom/Cargo.lock already pins
# hnsw_rs 0.3.4 from the registry — so the patch is inert here and would only force
# vendoring ruvector/patches/. Verified via `cargo metadata` on the trimmed root.

[workspace]
# Closeout (2026-07-03) FREEZE: the excluded HNSW-variant crates
# (micro-hnsw-wasm, ruvector-hyperbolic-hnsw, ruvector-hyperbolic-hnsw-wasm) and
# the rvf tree are EXPERIMENTAL / UNSUPPORTED as workspace members. They are not
# built or tested by `cargo build/test --workspace` and have no CI gate, so their
# suites can never regress-check here. Treat them as experimental until they are
# re-included with CI coverage (deferred). Do not advertise them as validated.
members = [
    "crates/ruvector-core",
]
resolver = "2"

[workspace.package]
version = "2.0.5"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Ruvector Team"]
repository = "https://github.com/ruvnet/ruvector"

[workspace.dependencies]
# Core functionality
redb = "2.1"
memmap2 = "0.9"
hnsw_rs = "0.3"
simsimd = "5.9"
rayon = "1.10"
crossbeam = "0.8"

# Serialization
rkyv = "0.8"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Node.js bindings
napi = { version = "2.16", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = "2.16"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "MessagePort", "console"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# Async runtime
tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"

# Error handling and utilities
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math and numerics
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"

# Time and UUID
chrono = "0.4"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"
console = "0.15"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
mockall = "0.13"

# Formal verification
lean-agentic = "=0.1.0"

# Performance
dashmap = "6.1"
parking_lot = "0.12"
once_cell = "1.20"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
