# Ontology Loom — colocated deployment (Deployment A: Loom + model on one host).
# BOTH facets are containers now: the `model` service is the llama.cpp engine
# (Qwen3.8-27B on :8085, the network-default endpoint — replaced the muse-glimmer
# systemd unit 2026-08-14), and the `loom` façade fronts it over the host network.
# Swap the model by editing the `model` service — the façade is unchanged; the model
# stays a URL behind DISTILL_BACKEND_URL.
#
#   docker compose up --build -d
#   curl http://127.0.0.1:8085/health   # model engine
#   curl http://127.0.0.1:8084/health   # façade
services:
  model:
    build: ./model
    image: loom-model:local
    container_name: loom-model
    network_mode: host                   # serve the LAN directly on 0.0.0.0:8085
    gpus: all                            # both RTX 6000s, layer-split by llama.cpp
    environment:
      PORT: "${MODEL_PORT:-8085}"
      CTX_SIZE: "${MODEL_CTX:-262144}"   # Qwen3.8 native context
      SPEC: "${MODEL_SPEC:-mtp}"         # embedded-MTP speculative decoding
      DRAFT_N_MAX: "${MODEL_DRAFT_N_MAX:-3}"  # swept 2026-08-15: n=3 29.9 tok/s > n=2 29.3 > n=4 26.3 > off 18.0
      KV_TYPE: "${MODEL_KV_TYPE:-q8_0}"
      REASONING_BUDGET: "${MODEL_REASONING_BUDGET:--1}"
      REASONING_EFFORT: "${MODEL_REASONING_EFFORT:-medium}"  # server default; per-request override via chat_template_kwargs
    volumes:
      # Model store stays on the host, mounted read-only.
      - /home/john/models:/models:ro
    restart: unless-stopped

  loom:
    build: .
    image: loom:local
    container_name: loom
    network_mode: host                     # reach the model container at 127.0.0.1
    depends_on:
      - model
    environment:
      LOOM_FACADE_PORT: "${LOOM_FACADE_PORT:-8084}"   # façade port on the host
      DISTILL_BACKEND_URL: "${DISTILL_BACKEND_URL:-http://127.0.0.1:8085/v1}"  # loom-model (Qwen3.8-27B)
      ONTOLOGY_BUDGET: "${LOOM_BUDGET:-1500}"
      LOOM_MIRROR_ON_START: "${LOOM_MIRROR_ON_START:-1}"
      ONTOLOGY_SITE: "https://narrativegoldmine.com"
      # Confidence-aware selective injection (optimisation #2). Enabled here for the
      # HP deployment; set LOOM_CONFIDENCE_INJECTION=0 to A/B against blanket grounding.
      LOOM_CONFIDENCE_INJECTION: "${LOOM_CONFIDENCE_INJECTION:-1}"
      LOOM_STRONG_MATCH_SCORE: "${LOOM_STRONG_MATCH_SCORE:-8.0}"   # full budget at/above this match score
      LOOM_MIN_INJECT_SCORE: "${LOOM_MIN_INJECT_SCORE:-2.0}"       # below this top score → skip injection
      LOOM_MIN_INJECT_FRACTION: "${LOOM_MIN_INJECT_FRACTION:-0.4}" # weakest kept match still gets this fraction of budget
    volumes:
      - loom-data:/app/data
    restart: unless-stopped
volumes:
  loom-data:
