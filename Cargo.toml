[workspace]
resolver = "2"
members = [
    "crates/loom-domain",
    "crates/loom-scaffold",
    "crates/loom-graph-oxigraph",
    "crates/loom-vector-ruvector",
    "crates/loom-embed-xinference",
    "crates/loom-backend-openai",
    "crates/loom-attest-proofgate",
    "crates/loom-facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV 1.89, NOT 1.88: ruvector-core's `simd` feature (enabled in our explicit
# feature set below) uses AVX-512 intrinsics (_mm512_*) that only stabilised in
# 1.89 — rust:1.88 fails with E0658 (verified in the deploy image build,
# 2026-08-17). Host machinelearn has 1.89.0; this container 1.97.0.
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/DreamLab-AI/loom"
authors = ["DreamLab-AI contributors"]

[workspace.lints.rust]
unsafe_code = "deny"                       # matches solid-pod-rs; the facade has no cause for unsafe
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# One place for versions; every crate uses `x = { workspace = true }`.
[workspace.dependencies]
tokio       = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
axum        = { version = "0.7",  features = ["json", "http1"] }
tower       = { version = "0.5",  features = ["timeout", "limit"] }
tower-http  = { version = "0.6",  features = ["trace", "cors", "limit"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oxigraph    = "0.4"
regex       = "1.10"
sha2        = "0.10"
async-trait = "0.1"
tokio-postgres = "0.7"
pgvector    = { version = "0.4", features = ["postgres"] }
# In-process HNSW: path-dep on the sibling workspace's core crate.
# HNSW search is behind the `hnsw` feature (aliasing the optional `hnsw_rs`
# dep); persistence behind `storage` (redb + memmap2). We take an EXPLICIT
# feature set rather than defaults: the default `api-embeddings` feature pulls
# reqwest 0.11 → rustls 0.21/rustls-webpki 0.101, which carry three RUSTSEC
# advisories — and the Loom never uses ruvector-core's embedding client
# (loom-embed-xinference owns embeddings). cargo-deny gates this.
ruvector-core = { path = "../ruvector/crates/ruvector-core", default-features = false, features = ["hnsw", "storage", "simd", "parallel"] }

[profile.release]
lto = "thin"          # sibling convention (solid-pod-rs); the static-binary win
codegen-units = 1
strip = "symbols"
panic = "abort"       # facade has no unwinding contract to preserve; smaller binary
